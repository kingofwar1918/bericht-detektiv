<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>Bericht-Detektiv</title>
<style>
:root{
  --bg:#f4f5f7; --karte:#ffffff; --text:#111827; --gedaempft:#4b5563;
  --akzent:#1d3557; --akzent-hell:#2f5d8a; --wahl:#c2410c; --rand:#c9ced6;
  --richtig:#166534; --richtig-bg:#e6f4ea; --falsch:#9f1d1d; --falsch-bg:#fbeaea;
  --merk-bg:#eef2f7; --radius:14px; --tap:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
     background:var(--bg);color:var(--text);font-size:20px;line-height:1.5}
.huelle{max-width:900px;margin:0 auto;padding:12px 16px 72px}
header.kopf{display:flex;align-items:center;justify-content:space-between;gap:10px;
            padding:6px 0 10px;border-bottom:2px solid var(--rand);margin-bottom:14px}
header.kopf h1{font-size:1.35rem;margin:0;color:var(--akzent)}
.status{font-size:.85rem;color:var(--gedaempft)}
h2{font-size:1.3rem;margin:.2em 0 .5em;line-height:1.35}
h3{font-size:1.1rem;margin:.8em 0 .3em}
p{margin:.4em 0}
.karte{background:var(--karte);border:1px solid var(--rand);border-radius:var(--radius);
       padding:20px;margin-bottom:14px}
button{font:inherit;min-height:var(--tap);min-width:var(--tap);padding:12px 18px;border-radius:12px;
       border:2px solid var(--rand);background:var(--karte);color:var(--text);cursor:pointer;
       touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:3px solid var(--akzent-hell);outline-offset:2px}
button[disabled]{cursor:default}
.primaer{background:var(--akzent);border-color:var(--akzent);color:#fff;font-weight:600}
.primaer[disabled]{background:#9aa5b4;border-color:#9aa5b4}
.klein{min-height:48px;font-size:1rem;padding:8px 14px}
.breit{width:100%;text-align:left}
.stapel{display:grid;gap:12px;margin:14px 0}
.zeile{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gedaempft{color:var(--gedaempft);font-size:.92rem}
.verborgen{display:none !important}
.leiste{height:12px;background:#dde2e8;border-radius:99px;overflow:hidden;margin:6px 0 4px}
.leiste > i{display:block;height:100%;background:var(--akzent-hell);width:0;transition:width .2s}
.antwort{width:100%;text-align:left;font-size:1.1rem;line-height:1.4}
.antwort.richtig{background:var(--richtig-bg);border-color:var(--richtig);color:var(--richtig);font-weight:600}
.antwort.falsch{background:var(--falsch-bg);border-color:var(--falsch);color:var(--falsch)}
.antwort .marke{display:block;font-size:.85rem;font-weight:700;margin-bottom:2px}
.rueckmeldung{margin-top:14px;padding:14px;border-radius:12px;border:2px solid transparent}
.rueckmeldung.ok{background:var(--richtig-bg);border-color:var(--richtig);color:#0f3d1f}
.rueckmeldung.nein{background:var(--falsch-bg);border-color:var(--falsch);color:#5c1111}
.merksatz{margin-top:12px;padding:12px 14px;background:var(--merk-bg);border-left:6px solid var(--akzent);
          border-radius:8px;font-size:1rem}
.merksatz b{display:block;font-size:.85rem;color:var(--akzent);text-transform:uppercase;letter-spacing:.04em}
.weiter-zeile{margin-top:16px;display:flex;justify-content:flex-end}
.wahlknopf{display:flex;align-items:center;gap:14px;text-align:left;width:100%}
.wahlknopf .sym{font-weight:800;color:var(--akzent);min-width:64px;text-align:center;flex:none;font-size:1.1rem}
.primaer.wahlknopf .sym{color:#fff}
.primaer.wahlknopf small{color:#dbe4f0}
button[disabled]:not(.richtig):not(.falsch):not(.fix):not(.erledigt):not(.primaer){opacity:.55}
.paar{display:inline-flex;align-items:flex-end;gap:2px}
.wahlknopf small{display:block;color:var(--gedaempft);font-size:.9rem;font-weight:400}
.segment{display:flex;gap:8px}
.segment button{flex:1}
.segment button.an{background:var(--akzent);color:#fff;border-color:var(--akzent);font-weight:600}
input[type=text],input[type=password],textarea{font:inherit;min-height:var(--tap);padding:10px 12px;
  border:2px solid var(--rand);border-radius:12px;width:100%;background:#fff;color:var(--text)}
textarea{min-height:200px;line-height:1.5;resize:vertical}
input:focus,textarea:focus{outline:3px solid var(--akzent-hell);outline-offset:1px}
label{display:block;font-weight:600;margin:12px 0 6px}
.fehlertext{color:var(--falsch);font-weight:600;margin-top:8px}
/* Modus 2: Satzteile */
.satz{display:flex;flex-wrap:wrap;gap:10px 8px;align-items:flex-end;margin:10px 0 6px;font-size:1.15rem}
.satz .text{padding:12px 2px}
.teil{position:relative;border:2px dashed var(--akzent-hell);background:#f7f9fc}
.teil.gewaehlt{border:3px solid var(--wahl);background:#fff7ed}
.teil.erledigt{border:2px solid var(--richtig);background:var(--richtig-bg);color:var(--richtig);padding-top:24px}
.teil .etikett{position:absolute;top:2px;left:8px;font-size:.8rem;font-weight:700}
.wraster{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:12px}
.wraster button{font-weight:600}
.wraster button.falsch{background:var(--falsch-bg);border-color:var(--falsch);color:var(--falsch)}
/* Ergebnis: Fehlermuster */
.muster{margin-top:12px;padding:12px 14px;background:#fff7ed;border-left:6px solid var(--wahl);border-radius:8px;color:#3b1d06}
.muster ul{margin:6px 0 0;padding-left:22px}
/* LP: Klassenziel und oft falsche Aufgaben */
.ziel-balken{height:32px;background:#dde2e8;border-radius:99px;overflow:hidden;margin:12px 0}
.ziel-balken i{display:block;height:100%;background:var(--richtig)}
.ziel-zahl{font-size:2.2rem;font-weight:800;color:var(--akzent);margin:6px 0}
.fehlerliste{margin:6px 0;padding-left:22px}
.fehlerliste li{margin:6px 0}
/* Modus 3: Reihenfolge */
.plaetze{display:grid;gap:10px;margin:10px 0 16px;padding:0;list-style:none}
.platz{display:flex;gap:12px;align-items:center}
.platz .nr{flex:none;width:44px;height:44px;border-radius:50%;background:var(--akzent);color:#fff;
           display:flex;align-items:center;justify-content:center;font-weight:700}
.platz .leer{flex:1;min-height:var(--tap);border:2px dashed var(--rand);border-radius:12px;
             display:flex;align-items:center;padding:0 14px;color:var(--gedaempft)}
.platz button{flex:1;text-align:left}
.platz button.fix{background:var(--richtig-bg);border-color:var(--richtig);color:var(--richtig);font-weight:600}
.pool{display:grid;gap:10px}
/* Modus 4: Lücke */
.luecke{display:inline-block;min-width:110px;border-bottom:3px solid var(--akzent);text-align:center;
        font-weight:700;color:var(--richtig)}
/* Check-Bot */
.markiert{background:#fff1d6;border-bottom:3px solid var(--wahl);padding:0 2px;border-radius:3px}
.cb-text{white-space:pre-wrap;padding:14px;background:#fafafa;border:1px solid var(--rand);border-radius:12px;line-height:1.8}
.cb-liste{list-style:none;padding:0;margin:8px 0}
.cb-liste li{padding:10px 12px;border-radius:10px;margin-bottom:8px}
.cb-liste.gut li{background:var(--richtig-bg);color:#0f3d1f}
.cb-liste.hin li{background:#fff7ed;color:#5a2a0a;border-left:5px solid var(--wahl)}
/* LP-Ansicht */
.code{font-size:3.2rem;font-weight:800;letter-spacing:.2em;color:var(--akzent);margin:0}
table{width:100%;border-collapse:collapse;font-size:1rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--rand);vertical-align:middle}
th{font-size:.85rem;color:var(--gedaempft)}
.minibalken{height:10px;background:#dde2e8;border-radius:99px;overflow:hidden;min-width:80px}
.minibalken i{display:block;height:100%;background:var(--akzent-hell)}
.rang{font-size:2rem}
.rang li{margin:10px 0}
.spalten{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.spalten{grid-template-columns:1fr}}
.uebersicht-item{border-bottom:1px solid var(--rand);padding:8px 0;font-size:.95rem}
.papier-wahl{padding:3px 0}
.papier-reihe{display:flex;gap:24px;flex-wrap:wrap}
.papier-satz{line-height:2.4}
.papier-name{font-size:1.05rem;margin:6px 0 10px}
.dialog-hg{position:fixed;inset:0;background:rgba(17,24,39,.5);display:flex;
           align-items:center;justify-content:center;padding:20px;z-index:50}
.dialog{background:#fff;border-radius:var(--radius);padding:22px;max-width:460px;width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
@media print{
  body{background:#fff;font-size:11pt}
  button,.nicht-drucken,header.kopf{display:none !important}
  .karte{border:1px solid #999;margin-bottom:8px;padding:8px}
  .uebersicht-item{break-inside:avoid}
  .huelle{max-width:none;padding:0}
  .spalten{grid-template-columns:1fr 1fr}
}
  .beamer-satz { font-size: 1.5rem; line-height: 1.8; margin: 14px 0; }
  .beamer-liste { font-size: 1.25rem; line-height: 1.7; }
</style>
</head>
<body>
<div class="huelle">
  <header class="kopf nicht-drucken">
    <h1>Bericht-Detektiv</h1>
    <div class="zeile">
      <span class="status" id="status"></span>
      <button class="klein" id="startknopf" type="button">Start</button>
    </div>
  </header>
  <main id="buehne"></main>
</div>

<!-- Konfiguration (Platzhalter). Fehlt die Datei, läuft die App im Einzelmodus. -->
<script src="firebase-config.js" onerror="window.BD_KONFIG_FEHLT = true"></script>

<script>
"use strict";
/* ========================================================================
   1. INHALT: nur dieser Block enthält Fragen und Texte.
   Die Logik weiter unten kennt keine konkreten Aufgaben.

   Version A = Fassung ● (Inhalte der bisherigen Version B, Stand 09.10.2026)
   Version B = Fassung ■ (neu: Sätze mit Nebensätzen, 3 bis 4 Auswahl-
               möglichkeiten mit ähnlich klingenden Fallen, 6 bis 7 Schritte)
   Auf dem Bildschirm der Lernenden steht nie «einfach» oder «schwer».

   Verbindlich: 01_entscheide.md (§0 Figuren/Orte, §1 Fachbegriffe,
   §2 Merksätze wortgleich, Nachtrag 2: keine Prüfungs-, Probe-, FLK-
   und Kap.-7-Inhalte).
   ======================================================================== */
const DATEN = {

  /* Merksätze wortgleich aus 01_entscheide.md §2 (M2 mit « - » als Trenner) */
  merksaetze: {
    M1: "Ein Bericht informiert sachlich über ein Ereignis. Er beantwortet die W-Fragen. Er steht im Präteritum.",
    M2: "Einleitung: Wer? Was? Wann? Wo? - Hauptteil: Wie? Der Reihe nach. - Schluss: Warum? Welche Folgen?",
    M3: "Sachlich heisst: keine Gefühle, keine Meinung, keine Übertreibung.",
    M4: "Eine Anleitung erklärt Schritt für Schritt, wie man etwas macht. Die Schritte sind nummeriert. Sie stehen in der Befehlsform."
  },

  /* Die fünf Modi. sym = kurzes Textzeichen auf dem Knopf (kein Bild, kein Emoji: reizarm) */
  modi: [
    { id: "m1", name: "Bericht oder Erzählung?", sym: "B|E", info: "Finde den Satz aus einem Bericht.", merksatz: "M3" },
    { id: "m2", name: "W-Fragen finden",         sym: "W?", info: "Welche W-Frage beantwortet der Satzteil?", merksatz: "M2" },
    { id: "m3", name: "Anleitung ordnen",        sym: "1-2-3", info: "Bring die Schritte in die richtige Reihenfolge.", merksatz: "M4" },
    { id: "m4", name: "Präteritum",              sym: "-te", info: "Wähle die richtige Verbform.", merksatz: "M1" },
    { id: "m5", name: "Check-Bot",               sym: "✓", info: "Prüfe deinen eigenen Bericht. Du bekommst Hinweise.", merksatz: "M3" }
  ],

  /* Namen der Fallen: [im Satz (Rückmeldung), im Ergebnis («Das übst du noch: …»)].
     Modus 1 nutzt die Schlüssel in «fallen», Modus 4 die Art der Verbform. */
  fallen: {
    gefuehl:       ["ein Gefühl", "Gefühle"],
    meinung:       ["eine Meinung oder Vermutung", "Meinungen und Vermutungen"],
    uebertreibung: ["eine Übertreibung", "Übertreibungen"],
    spannung:      ["Spannung wie in einer Erzählung", "Spannung wie in einer Erzählung"],
    zeit:          ["eine falsche Zeitform (nicht Präteritum)", "die Zeitform: Präteritum statt Präsens oder Perfekt"],
    ich:           ["die Ich- oder Wir-Form", "die Ich- oder Wir-Form"],
    praes:         ["Präsens", "Präsens statt Präteritum"],
    perf:          ["Perfekt", "Perfekt statt Präteritum"],
    plusq:         ["was vorher passiert war", "Formen wie «hatte gerufen» (was vorher passiert war)"],
    falsch:        ["eine falsche Form", "falsch gebildete Formen: Wie heisst das Verb im Präteritum?"]
  },

  /* ---------------------------------------------------------------------
     MODUS 1 «Bericht oder Erzählung?»
     bericht = der richtige Satz; andere = Sätze aus einer Erzählung;
     fallen = je Satz in «andere» die Fallen (Schlüssel aus DATEN.fallen, gleiche
              Reihenfolge wie «andere»): Rückmeldung zum gewählten Satz und
              Fehlermuster im Ergebnis («Das übst du noch: …»);
     tipp = Hilfe nach einem Fehlversuch; erklaerung = nach der Lösung.
     --------------------------------------------------------------------- */
  m1: {
    auftrag: "Welcher Satz passt in einen Bericht? Tippe ihn an.",
    A: [
      { bericht: "Am Montag, 9. November, blieb der Lift im Schulhaus Bach stecken.",
        andere: ["Ich drückte panisch auf alle Knöpfe.", "Der Lift bleibt stecken, und alle schreien laut."],
        fallen: [["gefuehl", "ich"], ["zeit"]],
        tipp: "Achte auf Gefühle und auf die Zeitform.",
        erklaerung: "Der Bericht-Satz ist sachlich und im Präteritum. «Panisch» zeigt ein Gefühl. «Bleibt» und «schreien» stehen im Präsens." },
      { bericht: "Am Freitagmorgen kletterte die Klasse 3b in der Kletterhalle Rosental.",
        andere: ["Die Wand war mindestens hundert Meter hoch!", "Dario klettert ganz nach oben und jubelt."],
        fallen: [["uebertreibung"], ["zeit"]],
        tipp: "Achte auf Übertreibungen und auf die Zeitform.",
        erklaerung: "Der Bericht-Satz nennt Wann, Wer und Wo. «Hundert Meter» ist übertrieben. «Klettert» und «jubelt» stehen im Präsens." },
      { bericht: "Der Hauswart, Herr Meier, holte die Katze mit einer Leiter vom Dach.",
        andere: ["Die arme Katze tat mir unendlich leid.", "Plötzlich miaut die Katze ganz laut."],
        fallen: [["gefuehl", "ich"], ["zeit", "spannung"]],
        tipp: "Achte auf Gefühle, Spannung und die Zeitform.",
        erklaerung: "Der Bericht-Satz sagt Wer, Was und Wie. «Tat mir unendlich leid» ist ein Gefühl. «Miaut» steht im Präsens, «Plötzlich» macht Spannung." },
      { bericht: "Das Dorffest in Rosental begann am Samstag um 14 Uhr.",
        andere: ["Es war das beste Fest aller Zeiten!", "Ich freue mich schon jetzt auf nächstes Jahr."],
        fallen: [["uebertreibung"], ["gefuehl", "ich", "zeit"]],
        tipp: "Achte auf Übertreibungen und Gefühle.",
        erklaerung: "Der Bericht-Satz nennt Wo und Wann. «Aller Zeiten» ist übertrieben. «Ich freue mich» ist ein Gefühl im Präsens." },
      { bericht: "Zwölf Lernende übernachteten von Freitag auf Samstag in der Schulbibliothek.",
        andere: ["Um Mitternacht hörten wir ein unheimliches Geräusch.", "Die Nacht ist total spannend."],
        fallen: [["spannung", "ich"], ["zeit", "meinung"]],
        tipp: "Achte auf Spannung und auf die Zeitform.",
        erklaerung: "Der Bericht-Satz ist sachlich. «Unheimlich» macht Spannung wie in einer Erzählung. «Ist» steht im Präsens." },
      { bericht: "Mia gewann das Tischtennis-Turnier in der Sporthalle Rosental mit 3 zu 1.",
        andere: ["Mia spielte wie eine Weltmeisterin!", "Mia gewinnt, und ich juble laut."],
        fallen: [["uebertreibung"], ["zeit", "gefuehl", "ich"]],
        tipp: "Achte auf Übertreibungen und auf «ich».",
        erklaerung: "Der Bericht-Satz nennt Wer, Wo und das Ergebnis. «Wie eine Weltmeisterin» ist übertrieben. «Gewinnt» steht im Präsens, «ich juble» zeigt ein Gefühl." },
      { bericht: "Luan schliff am Dienstag in der Werkstatt ein Brett für einen Schrank ab.",
        andere: ["Das Schleifen war voll langweilig.", "Luan schleift das Brett, und der Staub fliegt überall herum."],
        fallen: [["meinung"], ["zeit"]],
        tipp: "Achte auf Meinungen und auf die Zeitform.",
        erklaerung: "Der Bericht-Satz ist sachlich und im Präteritum. «Voll langweilig» ist eine Meinung. «Schleift» und «fliegt» stehen im Präsens." },
      { bericht: "In der Kita bastelte Sina mit vier Kindern Laternen aus Papier.",
        andere: ["Die Laternen waren die schönsten der ganzen Welt!", "Die Kinder basteln fröhlich und lachen."],
        fallen: [["uebertreibung"], ["zeit"]],
        tipp: "Achte auf Übertreibungen und auf die Zeitform.",
        erklaerung: "Der Bericht-Satz nennt Wo, Wer und Was. «Die schönsten der ganzen Welt» ist übertrieben. «Basteln» steht im Präsens." },
      { bericht: "Im Alterszentrum spielten am Nachmittag sechs Bewohnerinnen und Bewohner Lotto.",
        andere: ["Ich glaube, alle hatten furchtbare Langeweile.", "Elif ruft die Zahlen, und alle sind gespannt."],
        fallen: [["meinung", "ich"], ["zeit"]],
        tipp: "Achte auf Meinungen und auf die Zeitform.",
        erklaerung: "Der Bericht-Satz nennt Tatsachen. «Ich glaube» zeigt eine Meinung. «Ruft» und «sind» stehen im Präsens." },
      { bericht: "Die Klasse 3a spielte am Donnerstagabend ein Theater in der Aula.",
        andere: ["Vor dem Auftritt zitterten meine Knie vor Angst.", "Das Publikum klatscht wie verrückt."],
        fallen: [["gefuehl", "ich"], ["zeit", "uebertreibung"]],
        tipp: "Achte auf Gefühle und auf die Zeitform.",
        erklaerung: "Der Bericht-Satz nennt Wer, Wann, Was und Wo. «Vor Angst» ist ein Gefühl. «Klatscht wie verrückt» ist Präsens und übertrieben." },
      { bericht: "Der Schulbus kam am Montag wegen eines Staus 20 Minuten zu spät.",
        andere: ["Der Bus kommt sowieso nie pünktlich!", "Wir warteten ewig in der Kälte und froren schrecklich."],
        fallen: [["meinung"], ["uebertreibung", "ich"]],
        tipp: "Achte auf Meinungen und Übertreibungen.",
        erklaerung: "Der Bericht-Satz nennt Wann, Warum und wie lange. «Nie pünktlich» ist eine Meinung. «Ewig» und «schrecklich» übertreiben." },
      { bericht: "Am Samstag sammelte die Klasse 3b in Rosental Altpapier für die Klassenkasse.",
        andere: ["Wir schleppten tausend schwere Bündel!", "Ich finde Altpapier sammeln total doof."],
        fallen: [["uebertreibung", "ich"], ["meinung", "ich"]],
        tipp: "Achte auf Übertreibungen und Meinungen.",
        erklaerung: "Der Bericht-Satz nennt Wann, Wer, Wo und Warum. «Tausend Bündel» ist übertrieben. «Ich finde … doof» ist eine Meinung." }
    ],
    B: [
      { bericht: "Weil die Linde beim Schulhaus Bach krank war, fällte der Forstdienst sie am Mittwochmorgen.",
        andere: ["Leider fällte der Forstdienst am Mittwoch die schöne alte Linde beim Schulhaus Bach.",
                 "Am Mittwoch hat der Forstdienst die kranke Linde beim Schulhaus Bach gefällt.",
                 "Wir schauten vom Fenster aus zu, wie die Linde mit lautem Krachen umfiel."],
        fallen: [["meinung"], ["zeit"], ["ich", "spannung"]],
        tipp: "Prüfe jeden Satz einzeln: Gibt es eine Meinung, die Wir-Form oder eine falsche Zeitform?",
        erklaerung: "Der Bericht-Satz nennt Warum, Wer, Wann und Wo im Präteritum. «Leider» und «schöne» sind Meinungen, «hat gefällt» ist Perfekt. «Wir schauten zu» gehört in eine Erzählung." },
      { bericht: "Ein Lieferwagen blockierte am Montag eine Stunde lang die Einfahrt zur Sporthalle Rosental.",
        andere: ["Ein Lieferwagen blockierte am Montag rücksichtslos die Einfahrt zur Sporthalle Rosental.",
                 "Ein Lieferwagen blockiert am Montag eine Stunde lang die Einfahrt zur Sporthalle Rosental.",
                 "Ein riesiger Lieferwagen versperrte stundenlang die ganze Einfahrt zur Sporthalle."],
        fallen: [["meinung"], ["zeit"], ["uebertreibung"]],
        tipp: "Die Sätze sehen fast gleich aus. Vergleiche Wort für Wort und achte auf die Zeitform.",
        erklaerung: "Der Bericht-Satz ist genau: «eine Stunde lang». «Rücksichtslos» ist eine Meinung, «blockiert» steht im Präsens. «Riesig» und «stundenlang» übertreiben." },
      { bericht: "Während seiner Schnupperwoche als Elektroinstallateur zog Noah mit einem Monteur Kabel in einem Neubau.",
        andere: ["Noah schnupperte als Elektroinstallateur, was natürlich der beste Beruf überhaupt ist.",
                 "In der Schnupperwoche ist Noah jeden Tag mit einem Monteur in einen Neubau gefahren.",
                 "Ich durfte in meiner Schnupperwoche endlich richtige Kabel ziehen!"],
        fallen: [["meinung"], ["zeit"], ["ich", "gefuehl"]],

/* ========================================================================
   2. SPEICHER: localStorage, wenn vorhanden, sonst Arbeitsspeicher.
   ======================================================================== */
const Speicher = (() => {
  let vorhanden = false, ersatz = {};
  try {
    const p = "__test__";
    window.localStorage.setItem(p, "1");
    window.localStorage.removeItem(p);
    vorhanden = true;
  } catch (e) { vorhanden = false; }
  return {
    dauerhaft: vorhanden,
    lies(schluessel, standard) {
      try {
        const roh = vorhanden ? window.localStorage.getItem("bd_" + schluessel) : ersatz[schluessel];
        return roh == null ? standard : JSON.parse(roh);
      } catch (e) { return standard; }
    },
    schreib(schluessel, wert) {
      try {
        const roh = JSON.stringify(wert);
        if (vorhanden) window.localStorage.setItem("bd_" + schluessel, roh);
        else ersatz[schluessel] = roh;
      } catch (e) { /* Speichern ist nie kritisch */ }
    },
    loesche(schluessel) {
      try {
        if (vorhanden) window.localStorage.removeItem("bd_" + schluessel);
        else delete ersatz[schluessel];
      } catch (e) {}
    }
  };
})();

/* ========================================================================
   2b. SYNCHRONISIERUNG: Firebase Realtime Database über REST
   (Skill firebase-github-pages, assets/sync-schicht.js; Stufe 1 ohne Anmeldung).
   Kein Firebase-SDK: eine fetch-Anbindung, nichts wird nachgeladen.
   Die Regeln (database.rules.json) sind der Schutz, nicht dieser Code.
   ======================================================================== */
const KONFIG = (typeof window !== "undefined" && window.BD_KONFIG) ? window.BD_KONFIG : {};
const DB_DOMAIN = ".firebasedatabase.app";   // einziges erlaubtes Netzwerkziel
const ONLINE_EINGERICHTET = (() => {
  try {
    const u = new URL(String(KONFIG.datenbank || ""));
    return u.protocol === "https:" && u.hostname.endsWith(DB_DOMAIN) && !/DEIN-PROJEKT/i.test(u.hostname);
  } catch (e) { return false; }
})();

const CONFIG = {
  datenbank: ONLINE_EINGERICHTET ? KONFIG.datenbank : "",
  projekt: KONFIG.projekt || "bericht-detektiv",
  taktMs: Math.max(3000, Number(KONFIG.taktMs) || 4000),
  apiKey: ""                       // Stufe 1: keine Anmeldung
};

const Sync = (() => {
  let idToken = null;
  let abmeldeTimer = null;
  let taktId = null;
  let letzterFehler = null;
  let aktiverTakt = null;
  let beiAbmeldung = null;

  const WARTESCHLANGE = "syncWarteschlange";

  const ablage = {
    lies(schluessel, standard) {
      if (typeof Speicher !== "undefined") return Speicher.lies(schluessel, standard);
      try { const roh = window.localStorage.getItem(schluessel); return roh == null ? standard : JSON.parse(roh); }
      catch (e) { return standard; }
    },
    schreib(schluessel, wert) {
      if (typeof Speicher !== "undefined") return Speicher.schreib(schluessel, wert);
      try { window.localStorage.setItem(schluessel, JSON.stringify(wert)); } catch (e) {}
    },
  };

  const url = (pfad) => {
    const basis = `${CONFIG.datenbank.replace(/\/$/, "")}/${CONFIG.projekt}/` +
                  `${pfad.replace(/^\//, "")}.json`;
    return idToken ? `${basis}?auth=${encodeURIComponent(idToken)}` : basis;
  };

  async function anfrage(pfad, methode, koerper) {
    if (!CONFIG.datenbank) { letzterFehler = "nicht eingerichtet"; return { ok: false, status: 0 }; }
    try {
      const antwort = await fetch(url(pfad), {
        method: methode,
        headers: koerper !== undefined ? { "Content-Type": "application/json" } : undefined,
        body: koerper !== undefined ? JSON.stringify(koerper) : undefined,
      });
      if (!antwort.ok) {
        letzterFehler = `HTTP ${antwort.status}`;
        return { ok: false, status: antwort.status };
      }
      letzterFehler = null;
      return { ok: true, daten: await antwort.json() };
    } catch (e) {
      letzterFehler = "kein Netz";
      return { ok: false, status: 0 };
    }
  }

  function geraeteId() {
    let id = ablage.lies("geraeteId", null);
    if (!id) {
      const bytes = new Uint8Array(16);
      crypto.getRandomValues(bytes);
      id = [...bytes].map(b => b.toString(36).padStart(2, "0")).join("").slice(0, 24);
      ablage.schreib("geraeteId", id);
    }
    return id;
  }

  async function nachliefern() {
    const liste = ablage.lies(WARTESCHLANGE, []);
    if (!liste.length) return 0;
    let geliefert = 0;
    while (liste.length) {
      const { pfad, wert } = liste[0];
      const r = await anfrage(pfad, "PUT", wert);
      if (r.ok) { liste.shift(); geliefert++; continue; }
      if (r.status === 0) break;
      liste.shift();
    }
    ablage.schreib(WARTESCHLANGE, liste);
    return geliefert;
  }

  function abmeldenIntern(grund) {
    idToken = null;
    if (abmeldeTimer) { clearTimeout(abmeldeTimer); abmeldeTimer = null; }
    if (grund && typeof beiAbmeldung === "function") beiAbmeldung(grund);
  }

  function takt() {
    if (!aktiverTakt) return;
    const { pfad, rueckruf } = aktiverTakt;
    const holen = async () => {
      await nachliefern();
      const r = await Sync.lies(pfad);
      if (r.ok) rueckruf(r.daten);
    };
    holen();
    taktId = setInterval(holen, CONFIG.taktMs);
  }

  function pausieren() {
    if (taktId) { clearInterval(taktId); taktId = null; }
  }

  if (typeof document !== "undefined" && document.addEventListener) {
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) pausieren();
      else if (aktiverTakt && !taktId) takt();
    });
  }
  if (typeof window !== "undefined" && window.addEventListener) {
    window.addEventListener("online", () => { nachliefern(); });
  }

  const Sync = {
    get fehler() { return letzterFehler; },
    get angemeldet() { return idToken !== null; },
    get wartend() { return ablage.lies(WARTESCHLANGE, []).length; },
    geraeteId,
    lies: (pfad) => anfrage(pfad, "GET"),
    schreib: (pfad, wert) => anfrage(pfad, "PUT", wert),
    ergaenze: (pfad, wert) => anfrage(pfad, "PATCH", wert),
    loesche: (pfad) => anfrage(pfad, "DELETE"),
    async schreibSicher(pfad, wert) {
      const r = await anfrage(pfad, "PUT", wert);
      if (r.ok || r.status !== 0) return r;
      const liste = ablage.lies(WARTESCHLANGE, []);
      liste.push({ pfad, wert, zeit: Date.now() });
      ablage.schreib(WARTESCHLANGE, liste);
      return { ok: false, gepuffert: true };
    },
    nachliefern,
    get beiAbmeldung() { return beiAbmeldung; },
    set beiAbmeldung(f) { beiAbmeldung = f; },
    abmelden() { abmeldenIntern(null); },
    starteTakt(pfad, rueckruf) {
      pausieren();
      aktiverTakt = { pfad, rueckruf };
      if (typeof document === "undefined" || !document.hidden) takt();
    },
    stoppeTakt() {
      pausieren();
      aktiverTakt = null;
    },
  };
  return Sync;
})();

/* Falle 1: Eingabefelder nicht mitten im Tippen neu zeichnen. */
function darfNeuZeichnen() {
  const aktiv = document.activeElement;
  return !(aktiv && (aktiv.tagName === "INPUT" || aktiv.tagName === "TEXTAREA"));
}
/* Falle 2: nur bei echter Änderung neu zeichnen (Signatur). */
let letzteSignatur = null;
function hatSichGeaendert(daten) {
  const s = JSON.stringify(daten);
  if (s === letzteSignatur) return false;
  letzteSignatur = s;
  return true;
}

   3. HILFSMITTEL
   ======================================================================== */
const $ = (sel, wurzel = document) => wurzel.querySelector(sel);
const buehne = $("#buehne");

function el(tag, attribute = {}, ...kinder) {
  const k = document.createElement(tag);
  for (const [n, w] of Object.entries(attribute)) {
    if (n === "class") k.className = w;
    else if (n.startsWith("on")) k.addEventListener(n.slice(2).toLowerCase(), w);
    else if (w === true) k.setAttribute(n, "");
    else if (w !== null && w !== undefined && w !== false) k.setAttribute(n, w);
  }
  for (const kind of kinder.flat()) {
    if (kind == null || kind === false) continue;
    k.append(kind instanceof Node ? kind : document.createTextNode(String(kind)));
  }
  return k;
}

function frage(text, beiJa, jaText = "Ja", neinText = "Abbrechen") {
  const hg = el("div", { class: "dialog-hg nicht-drucken" });
  const schliessen = () => hg.remove();
  hg.append(el("div", { class: "dialog", role: "dialog" },
    el("p", {}, text),
    el("div", { class: "zeile", style: "margin-top:14px" },
      el("button", { class: "primaer", type: "button", onclick: () => { schliessen(); beiJa(); } }, jaText),
      el("button", { type: "button", onclick: schliessen }, neinText))));
  document.body.append(hg);
}

function mischen(liste) {
  const a = liste.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function csvHerunterladen(dateiname, zeilen) {
  const inhalt = "\uFEFF" + zeilen.map(z =>
    z.map(f => `"${String(f).replace(/"/g, '""')}"`).join(";")).join("\r\n");
  const url = URL.createObjectURL(new Blob([inhalt], { type: "text/csv;charset=utf-8" }));
  const a = el("a", { href: url, download: dateiname });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function merksatzBox(id) {

}
function modusInfo(id) { return DATEN.modi.find(m => m.id === id); }
function fassung(v) { return v === "B" ? "■" : "●"; }
function zahlItems(modus, version) { return modus === "m5" ? 0 : DATEN[modus][version].length; }
function laufTotal(l) { return l.reihenfolge.length; }   // bei «Nur diese nochmals» weniger als 12
function aufzaehlen(liste) { return liste.length < 2 ? liste.join("") : liste.slice(0, -1).join(", ") + " und " + liste[liste.length - 1]; }

  raumDaten: null,      // letzter Stand aus der Datenbank (Lernende)
  infoSignatur: null,

function zufallsName() {
  const t = DATEN.tiere[Math.floor(Math.random() * DATEN.tiere.length)];

function beitretenBild() {
  const code = el("input", { type: "text", inputmode: "numeric", maxlength: "4", autocomplete: "off",
                             id: "code", placeholder: "z.B. 4821", pattern: "[0-9]*" });
  const name = el("input", { type: "text", maxlength: "16", autocomplete: "off", id: "spielname",
                             autocapitalize: "words", spellcheck: "false", placeholder: "z.B. Luchs 27" });
  const fehler = el("p", { class: "fehlertext", role: "alert" });
  const los = el("button", { class: "primaer", type: "button" }, "Beitreten");

  los.addEventListener("click", async () => {
    const c = code.value.trim(), n = name.value.trim().replace(/\s+/g, " ");
    fehler.textContent = "";
    if (!/^[0-9]{4}$/.test(c)) { fehler.textContent = "Der Code hat 4 Ziffern."; code.focus(); return; }
    if (!/^[A-Za-zÄÖÜäöüÉÈÀéèàçÇ0-9 \-]{2,16}$/.test(n)) {
      fehler.textContent = "Der Spielname hat 2 bis 16 Zeichen: Buchstaben, Zahlen, Leerzeichen."; name.focus(); return;
    }
    los.disabled = true; los.textContent = "Einen Moment …";
    const r = await Sync.lies(`oeffentlich/raeume/${c}`);
    los.disabled = false; los.textContent = "Beitreten";
    if (!r.ok) {
      fehler.textContent = r.status === 0 ? "Keine Verbindung. Du kannst allein üben." : "Der Raum ist nicht erreichbar.";
      fehler.append(el("br"), el("button", { class: "klein", type: "button", style: "margin-top:8px",
        onclick: () => { Zustand.sitzung = { art: "allein" }; gehe("allein"); } }, "Allein üben"));
      return;
    }
    if (!r.daten || !r.daten.info) { fehler.textContent = "Diesen Raum gibt es nicht. Prüfe den Code."; return; }
    const sitzung = { art: "raum", code: c, name: n, id: Sync.geraeteId() };
    Zustand.sitzung = sitzung;
    Zustand.lauf = null;
    Zustand.infoSignatur = null;

    el("p", { class: "gedaempft" }, "Nimm einen Spielnamen. Schreib nicht deinen echten Namen."),
    fehler,

function raumWiederBetreten(s) {

/* Stand der Lernenden in die Datenbank schreiben (nur Spielname + Zahlen). */
async function meldeStand(teil) {
  const s = Zustand.sitzung;
  if (!s || s.art !== "raum") return;
  const l = Zustand.lauf;
  const wert = Object.assign({
    n: s.name,
    v: l ? l.version : "A",
    m: l ? l.modus : "keiner",
    rd: l ? l.runde : 0,
    b: l ? l.index : 0,
    t: l ? laufTotal(l) : 0,
    p: l ? l.punkte : 0,
    zeit: Date.now()
  }, teil || {});
  // Wiederholung («Nur diese n nochmals», «Alle nochmals üben») in derselben Runde: Stand der
  // Hauptrunde behalten, damit Klassenziel und Fortschritt auf dem Beamer nie rückwärts springen.
  const h = Zustand.haupt;
  if (l && !teil) {
    if (l.wiederholung && h && h.rd === l.runde && h.m === l.modus && h.v === l.version) {
      const voll = laufTotal(l) === h.t;
      wert.b = Math.max(h.b, voll ? l.index : 0);
      wert.t = h.t;
      wert.p = Math.max(h.p, voll ? l.punkte : 0);
    }
    if (!h || h.rd !== l.runde || h.m !== l.modus || h.v !== l.version || !l.wiederholung || wert.b > h.b) {
      Zustand.haupt = { rd: wert.rd, m: wert.m, v: wert.v, b: wert.b, t: wert.t, p: wert.p };
    }
  }
  await Sync.schreibSicher(`oeffentlich/raeume/${s.code}/spieler/${s.id}`, wert);
  statusAktualisieren();
}

/* Takt für Lernende: reagiert nur auf Änderungen in info (Modus, Runde, Status). */
function raumBeobachten() {
  const s = Zustand.sitzung;
  Sync.starteTakt(`oeffentlich/raeume/${s.code}`, (daten) => {
    if (!Zustand.sitzung || Zustand.sitzung.art !== "raum") return;
    if (!daten || !daten.info) { raumGeschlossen(); return; }
    Zustand.raumDaten = daten;
    const info = daten.info;
    const sig = `${info.runde}|${info.status}|${info.modus}`;
    if (sig === Zustand.infoSignatur) return;
    if (!darfNeuZeichnen()) return;           // nicht beim Tippen umschalten; nächster Takt
    Zustand.infoSignatur = sig;
    aufInfoReagieren(info, daten);
  });
}

function aufInfoReagieren(info, daten) {
  const s = Zustand.sitzung;
  if (info.status === "laeuft" && info.modus && info.modus !== "keiner") {
    if (!Zustand.lauf || Zustand.lauf.runde !== info.runde) {
      const zut = (daten.zuteilung || {})[s.id];
      const version = zut === "A" || zut === "B" ? zut : (info.vStandard === "B" ? "B" : "A");
      laufStarten(info.modus, version, info.runde);
    }
  } else if (Zustand.lauf && ["aufgabe", "checkbot"].includes(Zustand.bildschirm)) {
    Zustand.hinweis = "Die Lehrperson hat die Übung beendet.";
    gehe(Zustand.lauf.modus === "m5" ? "warten" : "ergebnis");
  } else if (Zustand.bildschirm === "warten") {
    zeichnen();
  }
}

function raumGeschlossen() {
  Sync.stoppeTakt();
  Speicher.loesche("sitzung");
  Zustand.sitzung = null;
  Zustand.lauf = null;
  Zustand.bildschirm = "start";
  zeichnen();
  buehne.prepend(el("div", { class: "rueckmeldung nein", role: "status" }, "Der Raum ist geschlossen. Du kannst allein üben."));
}

function wartenBild() {
  const s = Zustand.sitzung;
  if (!s || s.art !== "raum") { gehe("start"); return; }
  const info = Zustand.raumDaten && Zustand.raumDaten.info;
  buehne.append(el("div", { class: "karte" },
    el("h2", {}, `Hallo, ${s.name}!`),
    el("p", {}, `Du bist im Raum ${s.code}.`),
    Zustand.hinweis ? el("p", { class: "rueckmeldung ok" }, Zustand.hinweis) : null,
    el("p", {}, info && info.status === "laeuft" ? "Die Übung startet gleich …" : "Warte, bis die Lehrperson eine Übung startet."),
    el("p", { class: "gedaempft" }, "Du musst nichts tippen. Die Übung erscheint von selbst.")),
    el("div", { class: "zeile" },
      el("button", { class: "klein", type: "button", onclick: () => frage("Willst du den Raum verlassen?", raumVerlassen, "Ja, verlassen") }, "Raum verlassen")));
  Zustand.hinweis = "";
}

async function raumVerlassen() {
  const s = Zustand.sitzung;
  Sync.stoppeTakt();
  if (s && s.art === "raum") await Sync.loesche(`oeffentlich/raeume/${s.code}/spieler/${s.id}`);
  Speicher.loesche("sitzung");
  Zustand.sitzung = null; Zustand.lauf = null; Zustand.infoSignatur = null;
  gehe("start");
}

/* ---------- Allein üben: Version und Modus wählen ---------- */
function alleinBild() {

    segA.setAttribute("aria-pressed", String(v === "A")); segB.setAttribute("aria-pressed", String(v === "B")); };
  segA.addEventListener("click", () => setze("A"));
  segB.addEventListener("click", () => setze("B"));

        el("span", { class: "sym", "aria-hidden": "true" }, m.sym),
        el("span", {}, m.name, el("small", {}, m.info))))));

/* ---------- Übung starten ---------- */
function laufStarten(modus, version, runde, auswahl, nochmals) {
  const n = zahlItems(modus, version);
  const liste = auswahl && auswahl.length ? auswahl.slice() : [...Array(n).keys()];
  Zustand.lauf = {
    modus, version, runde: runde || 0,
    reihenfolge: n ? mischen(liste) : [],
    index: 0, punkte: 0, ersteVersuche: 0, fehler: 0,
    fehlerItems: [],                 // Aufgaben (Nummer in DATEN) mit mindestens einem Fehlversuch
    fallen: {},                      // Fehlermuster: Falle bzw. W-Frage -> Anzahl
    wiederholung: !!(auswahl && auswahl.length) || !!nochmals,
    gezaehltW: {}                    // Modus 2: Satzteile, deren W-Frage schon gezählt wurde
  };
  meldeStand();
  gehe(modus === "m5" ? "checkbot" : "aufgabe");
}

function aktuellesItem() {
  const l = Zustand.lauf;
  return DATEN[l.modus][l.version][l.reihenfolge[l.index]];
}

/* Ein Item ist gelöst: Punkte vergeben (2 = beim ersten Versuch, 1 = mit Hilfe). */
function itemGeloest() {
  const l = Zustand.lauf;
  if (l.fehler === 0) { l.punkte += 2; l.ersteVersuche++; } else { l.punkte += 1; }
}

/* Ein Fehlversuch: zählen, Fehlermuster sammeln, beim ersten Fehlversuch einer Aufgabe
   den anonymen Zähler des Raums erhöhen (nur Zahl pro Aufgabe, kein Name, keine Antwort). */
const W_SCHLUESSEL = { "Wer?": "wer", "Was?": "was", "Wann?": "wann", "Wo?": "wo", "Wie?": "wie", "Warum?": "warum" };
function fehlerVermerken(falle) {
  const l = Zustand.lauf;
  l.fehler++;
  [].concat(falle || []).forEach(f => { l.fallen[f] = (l.fallen[f] || 0) + 1; });
  if (l.fehler === 1) {
    const nr = l.reihenfolge[l.index];
    l.fehlerItems.push(nr);
    raumFehlerZaehlen(l, nr);
  }
}

/* Pro Gerät, Runde und Aufgabe höchstens einmal zählen (auch nach Neuladen der Seite). */
function schonGezaehlt(schluessel) {
  const s = Zustand.sitzung;
  const alle = Speicher.lies("gezaehlt", {});
  const praefix = `${s.code}_`;
  const sauber = {};
  Object.keys(alle).filter(k => k.startsWith(praefix)).forEach(k => { sauber[k] = alle[k]; });
  if (sauber[schluessel]) return true;
  sauber[schluessel] = 1;
  Speicher.schreib("gezaehlt", sauber);
  return false;
}

async function raumFehlerZaehlen(l, nr, wFrage) {
  const s = Zustand.sitzung;
  if (!s || s.art !== "raum" || l.wiederholung) return;
  const mv = `${l.modus}${l.version}${wFrage ? "w" : ""}`;
  const feld = wFrage ? `${W_SCHLUESSEL[wFrage]}` : `${nr}`;
  if (!feld || schonGezaehlt(`${s.code}_${l.runde}_${mv}_${wFrage ? nr + "_" + wFrage : nr}`)) return;
  const pfad = `oeffentlich/raeume/${s.code}/fehler/${mv}/${feld}`;
  const r = await Sync.schreibSicher(pfad, { ".sv": { "increment": 1 } });
  if (!r.ok && !r.gepuffert && r.status === 400) {       // Rückfall, falls der Server «increment» nicht kennt
    const alt = await Sync.lies(pfad);
    if (alt.ok) await Sync.schreib(pfad, Math.min(99, (Number(alt.daten) || 0) + 1));
  }
}

function weiterGehen() {
  const l = Zustand.lauf;
  l.index++;
  l.fehler = 0;
  meldeStand();
  if (l.index >= laufTotal(l)) {
    if (!Zustand.sitzung || Zustand.sitzung.art !== "raum") {
      const verlauf = Speicher.lies("verlauf", []);
      verlauf.push({ modus: l.modus, version: l.version, erste: l.ersteVersuche, total: l.index, zeit: Date.now() });
      Speicher.schreib("verlauf", verlauf.slice(-50));
    }
    gehe("ergebnis");
  } else {
    zeichnen();
  }
}

function rahmenAufgabe(auftrag, ...inhalt) {
  const l = Zustand.lauf;
  const total = laufTotal(l);
  buehne.append(
    el("div", { class: "nicht-drucken" },
      el("div", { class: "zeile", style: "justify-content:space-between" },
        el("span", { class: "gedaempft" }, modusInfo(l.modus).name),
        el("span", { class: "gedaempft" }, `Aufgabe ${l.index + 1} von ${total}`)),
      el("div", { class: "leiste", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": String(total), "aria-valuenow": String(l.index) },
        el("i", { style: `width:${l.index / total * 100}%` }))),
    el("div", { class: "karte" }, el("h2", {}, auftrag), ...inhalt));
}

function weiterKnopf() {
  const letzte = Zustand.lauf.index + 1 >= laufTotal(Zustand.lauf);
  return el("div", { class: "weiter-zeile" },
    el("button", { class: "primaer", type: "button", onclick: weiterGehen }, letzte ? "Zum Ergebnis" : "Weiter"));
}

function aufgabeBild() {
  const l = Zustand.lauf;
  if (!l) { gehe("start"); return; }
  ({ m1: modus1, m2: modus2, m3: modus3, m4: modus4 }[l.modus])(aktuellesItem());
}

/* ---------- MODUS 1: Bericht oder Erzählung? ---------- */
function modus1(item) {
  const rueck = el("div", { class: "", role: "status", "aria-live": "polite" });
  const fertig = el("div");
  const saetze = mischen([{ t: item.bericht, ok: true }].concat(item.andere.map((t, j) => ({ t, ok: false, fallen: (item.fallen && item.fallen[j]) || [] }))));
  const knoepfe = saetze.map(s => {
    const b = el("button", { class: "antwort", type: "button" }, s.t);
    b.addEventListener("click", () => {
      if (s.ok) {
        itemGeloest();
        knoepfe.forEach(k => { k.disabled = true; });
        b.className = "antwort richtig";
        b.prepend(el("span", { class: "marke" }, "✓ Bericht"));
        rueck.className = "rueckmeldung ok";
        rueck.replaceChildren(el("strong", {}, "Richtig. "), item.erklaerung, merksatzBox("M3"));
        fertig.replaceChildren(weiterKnopf());
        meldeStand();
      } else {
        fehlerVermerken(s.fallen);
        b.disabled = true;
        b.className = "antwort falsch";
        b.prepend(el("span", { class: "marke" }, "Erzählung"));
        rueck.className = "rueckmeldung nein";
        // Rückmeldung zum GEWÄHLTEN Satz (verrät den richtigen nicht), danach der Tipp
        const namen = s.fallen.filter(f => DATEN.fallen[f]).map(f => DATEN.fallen[f][0]);
        rueck.replaceChildren(el("strong", {}, "Noch nicht. "),
          namen.length ? `In diesem Satz steckt ${aufzaehlen(namen)}. ` : "", "Tipp: " + item.tipp);
      }
    });
    return b;
  });
  rahmenAufgabe(DATEN.m1.auftrag, el("div", { class: "stapel" }, knoepfe), rueck, fertig);
}

/* ---------- MODUS 2: W-Fragen finden ---------- */
function modus2(item) {
  const l = Zustand.lauf;
  const rueck = el("div", { class: "", role: "status", "aria-live": "polite" });
  const fertig = el("div");
  const offen = [];
  let gewaehlt = null;
  let wKnoepfe = [];
  const hinweisZeile = el("p", { class: "gedaempft" }, "");

  const satz = el("div", { class: "satz" });
  const gruppen = {};   // Gruppennummer -> Eintrag (getrennte Teile von «Was?» zählen als ein Satzteil)
  item.teile.forEach(([text, w, gruppe]) => {
    if (!w && /^[.,!?]$/.test(text) && satz.lastChild) {
      // Satzzeichen bleibt am vorherigen Satzteil (kein Umbruch davor)
      const vorher = satz.lastChild;
      const paar = el("span", { class: "paar" });
      satz.replaceChild(paar, vorher);
      paar.append(vorher, el("span", { class: "text" }, text));
      return;
    }
    if (!w) { satz.append(el("span", { class: "text" }, text)); return; }
    const b = el("button", { class: "teil", type: "button", "aria-pressed": "false" }, text);
    let eintrag = gruppe ? gruppen[gruppe] : null;
    if (eintrag) { eintrag.knoepfe.push(b); eintrag.texte.push(text); }
    else {
      eintrag = { knoepfe: [b], texte: [text], w, erledigt: false, versuche: [] };
      if (gruppe) gruppen[gruppe] = eintrag;
      offen.push(eintrag);
    }
    const dieser = eintrag;
    b.addEventListener("click", () => { if (!dieser.erledigt) waehle(dieser); });
    satz.append(b);
  });

  function waehle(e) {
    offen.forEach(o => o.knoepfe.forEach(k => { k.classList.remove("gewaehlt"); k.setAttribute("aria-pressed", "false"); }));
    gewaehlt = e;
    if (e) e.knoepfe.forEach(k => { k.classList.add("gewaehlt"); k.setAttribute("aria-pressed", "true"); });
    hinweisZeile.textContent = (e && e.knoepfe.length > 1)
      ? "Die Teile mit dem dicken orangen Rahmen gehören zusammen. Welche W-Frage passt?"
      : "Der Satzteil mit dem dicken orangen Rahmen ist gewählt. Welche W-Frage passt?";
    // W-Fragen, die bei diesem Satzteil schon falsch waren, bleiben rot und gesperrt
    wKnoepfe.forEach(k => {
      const schonFalsch = !!(e && e.versuche.includes(k.dataset.w));
      k.classList.toggle("falsch", schonFalsch);
      k.disabled = schonFalsch;
    });
  }

  const raster = el("div", { class: "wraster" }, DATEN.m2.knoepfe[l.version].map(w => {
    const k = el("button", { type: "button", "data-w": w }, w);
    k.addEventListener("click", () => {
      if (!gewaehlt) { rueck.className = "rueckmeldung nein"; rueck.replaceChildren("Tippe zuerst auf einen Satzteil."); return; }
      if (w === gewaehlt.w) {
        gewaehlt.erledigt = true;
        gewaehlt.knoepfe.forEach((k, i) => {
          k.classList.remove("gewaehlt");
          k.classList.add("erledigt");
          k.disabled = true;
          k.prepend(el("span", { class: "etikett" }, i === 0 ? "✓ " + w : "✓ … " + w));
        });
        const naechster = offen.find(o => !o.erledigt);
        if (naechster) {
          rueck.className = "rueckmeldung ok";
          rueck.replaceChildren(el("strong", {}, "Richtig. "), "Weiter mit dem nächsten Satzteil.");
          waehle(naechster);
        } else {
          gewaehlt = null;
          itemGeloest();
          raster.classList.add("verborgen");
          hinweisZeile.classList.add("verborgen");
          rueck.className = "rueckmeldung ok";
          rueck.replaceChildren(el("strong", {}, "Richtig. "), "Du hast alle W-Fragen gefunden.", merksatzBox("M2"));
          fertig.replaceChildren(weiterKnopf());
          meldeStand();
        }
      } else {
        // Gestufte Hilfe pro Satzteil: 1. Frage zur gewählten W-Frage, 2. Tipp zur richtigen, 3. Lösung
        const e = gewaehlt;
        e.versuche.push(w);
        const stufe = e.versuche.length;
        fehlerVermerken(stufe === 1 ? e.w : null);
        if (stufe === 1) raumFehlerZaehlen(l, l.reihenfolge[l.index], e.w);
        k.classList.add("falsch");
        k.disabled = true;
        let text;
        if (stufe === 1) text = DATEN.m2.hilfeFalsch[w].replace("{teil}", e.texte.join(" … "));
        else if (stufe === 2) text = "Tipp: " + DATEN.m2.hilfe[e.w];
        else text = `Die Lösung ist «${e.w}». Tippe auf «${e.w}».`;
        rueck.className = "rueckmeldung nein";
        rueck.replaceChildren(el("strong", {}, "Noch nicht. "), text);
      }
    });
    return k;
  }));
  wKnoepfe = [...raster.querySelectorAll("button")];

  waehle(offen[0]);
  rahmenAufgabe(DATEN.m2.auftrag, satz, hinweisZeile, raster, rueck, fertig);
}

/* ---------- MODUS 3: Anleitung ordnen (Tippen statt Ziehen) ---------- */
function modus3(item) {
  const l = Zustand.lauf;
  const n = item.schritte.length;
  const plaetze = new Array(n).fill(null);   // Index des Schritts oder null
  const fix = new Array(n).fill(false);
  if (DATEN.m3.schritt1Vorgegeben[l.version]) { plaetze[0] = 0; fix[0] = true; }

  let pool = mischen([...Array(n).keys()].filter(i => !plaetze.includes(i)));
  // Nicht zufällig schon richtig sortiert anbieten
  if (pool.length > 1 && pool.every((v, i) => i === 0 || pool[i - 1] < v)) pool.push(pool.shift());

  const listeEl = el("ol", { class: "plaetze" });
  const poolEl = el("div", { class: "pool" });
  const pruefen = el("button", { class: "primaer", type: "button", disabled: true }, "Reihenfolge prüfen");
  const rueck = el("div", { class: "", role: "status", "aria-live": "polite" });
  const fertig = el("div");

  function neu() {
    listeEl.replaceChildren(...plaetze.map((s, i) => el("li", { class: "platz" },
      el("span", { class: "nr", "aria-hidden": "true" }, String(i + 1)),
      s === null
        ? el("span", { class: "leer" }, "…")
        : el("button", { type: "button", class: fix[i] ? "fix" : "", disabled: fix[i],
                         "aria-label": `Schritt ${i + 1}: ${item.schritte[s]}${fix[i] ? "" : " (antippen zum Entfernen)"}`,
                         onclick: () => { plaetze[i] = null; pool.push(s); neu(); } },
            (fix[i] ? "✓ " : "") + item.schritte[s]))));
    poolEl.replaceChildren(...pool.map(s => el("button", { class: "antwort", type: "button",
      onclick: () => { const frei = plaetze.indexOf(null); if (frei < 0) return; plaetze[frei] = s; pool = pool.filter(x => x !== s); neu(); } },
      item.schritte[s])));
    pruefen.disabled = plaetze.includes(null);
    poolEl.parentElement && (poolEl.previousElementSibling.classList.toggle("verborgen", pool.length === 0));
  }

  pruefen.addEventListener("click", () => {
    let richtig = 0;
    plaetze.forEach((s, i) => {
      if (s === i) { richtig++; fix[i] = true; }
      else if (!fix[i]) { pool.push(s); plaetze[i] = null; }
    });
    if (richtig === n) {
      itemGeloest();
      pruefen.classList.add("verborgen");
      rueck.className = "rueckmeldung ok";
      rueck.replaceChildren(el("strong", {}, "Richtig. "), item.erklaerung, merksatzBox("M4"));
      fertig.replaceChildren(weiterKnopf());
      meldeStand();
    } else {
      fehlerVermerken(null);
      pool = mischen(pool);
      rueck.className = "rueckmeldung nein";
      rueck.replaceChildren(el("strong", {}, "Noch nicht. "),
        `${richtig} von ${n} Schritten stimmen. Die grünen Schritte bleiben. Ordne die anderen neu.`);
    }
    neu();
  });

  rahmenAufgabe(DATEN.m3.auftrag,
    el("h3", {}, item.titel),
    DATEN.m3.schritt1Vorgegeben[l.version] ? el("p", { class: "gedaempft" }, "Schritt 1 steht schon da.") : null,
    listeEl,
    el("p", { class: "gedaempft" }, "Diese Schritte fehlen noch. Tippe den nächsten an:"),
    poolEl,
    el("div", { class: "weiter-zeile" }, pruefen),
    rueck, fertig);
  neu();
}

/* ---------- MODUS 4: Präteritum ---------- */
function modus4(item) {
  const rueck = el("div", { class: "", role: "status", "aria-live": "polite" });
  const fertig = el("div");
  const [vor, nach] = item.satz.split("___");
  const luecke = el("span", { class: "luecke" }, "\u00a0".repeat(6));
  const richtigeForm = item.optionen.find(o => o[1] === "praet")[0];
  const erkl = {
    praes: (f) => `«${f}» ist Präsens. Das Präsens zeigt: jetzt. Im Bericht brauchst du das Präteritum.`,
    perf: (f) => `«${f}» ist Perfekt. Das Perfekt hat zwei Teile. Im Bericht brauchst du das Präteritum. Hier ist es ein Wort.`,
    plusq: (f) => `«${f}» zeigt, was vorher passiert war. Hier brauchst du das Ereignis selbst: Präteritum.`,
    konj: (f) => `«${f}» passt nicht. Ein Bericht sagt, was wirklich passiert ist: Präteritum.`,
    falsch: (f) => `«${f}» gibt es nicht. Das Verb «${item.grundform}» verändert sich im Präteritum.`
  };
  const knoepfe = mischen(item.optionen).map(([form, art, eigene]) => {
    const b = el("button", { class: "antwort", type: "button", style: "text-align:center" }, form);
    b.addEventListener("click", () => {
      if (art === "praet") {
        itemGeloest();
        knoepfe.forEach(k => { k.disabled = true; });
        b.className = "antwort richtig";
        luecke.textContent = form;
        rueck.className = "rueckmeldung ok";
        rueck.replaceChildren(el("strong", {}, "Richtig. "), `${item.grundform} → ${richtigeForm}. Das ist Präteritum.`, merksatzBox("M1"));
        fertig.replaceChildren(weiterKnopf());
        meldeStand();
      } else {
        fehlerVermerken(art);
        b.disabled = true;
        b.className = "antwort falsch";
        rueck.className = "rueckmeldung nein";
        rueck.replaceChildren(el("strong", {}, "Noch nicht. "), eigene || erkl[art](form));
      }
    });
    return b;
  });
  rahmenAufgabe(DATEN.m4.auftrag,
    el("p", { style: "font-size:1.25rem;margin:14px 0" }, vor, luecke, nach,
      el("span", { class: "gedaempft" }, ` (${item.grundform})`)),
    el("div", { class: "stapel", style: "grid-template-columns:repeat(auto-fit,minmax(150px,1fr))" }, knoepfe),
    rueck, fertig);
}

/* ---------- Ergebnis ---------- */
/* Fehlermuster: was die Lernenden gezielt nochmals üben («Das übst du noch: …»). */
function fehlermuster(l) {
  if (!l.fehlerItems.length) return [];
  if (l.modus === "m3") return [...new Set(l.fehlerItems)].map(nr => DATEN.m3[l.version][nr].titel);
  const eintraege = Object.entries(l.fallen).sort((a, b) => b[1] - a[1]);
  if (!eintraege.length) return [];
  if (l.modus === "m2") return eintraege.map(([w]) => w);                    // W-Fragen, häufigste zuerst
  const max = eintraege[0][1];                                               // Modus 1 und 4: häufigste Falle(n)
  return eintraege.filter(([, n]) => n === max).slice(0, 2)
    .map(([f]) => (DATEN.fallen[f] ? DATEN.fallen[f][1] : f));
}

function ergebnisBild() {
  const l = Zustand.lauf;
  if (!l) { gehe("start"); return; }
  const total = laufTotal(l);
  const geloest = Math.min(l.index, total);
  const imRaum = Zustand.sitzung && Zustand.sitzung.art === "raum";
  const muster = fehlermuster(l);
  const nochmals = [...new Set(l.fehlerItems)];
  buehne.append(el("div", { class: "karte" },
    Zustand.hinweis ? el("p", { class: "gedaempft" }, Zustand.hinweis) : null,
    el("h2", {}, geloest === total ? `Geschafft! Du hast alle ${total} Aufgaben gelöst.` : `Du hast ${geloest} von ${total} Aufgaben gelöst.`),
    el("p", {}, `Beim ersten Versuch richtig: ${l.ersteVersuche} von ${geloest}.`),
    el("p", { class: "gedaempft" }, `Punkte: ${l.punkte} von ${geloest * 2}`),
    nochmals.length
      ? el("div", { class: "muster" },
          el("strong", {}, { m2: "Das übst du noch: diese W-Fragen", m3: "Das übst du noch: diese Anleitungen" }[l.modus]
                           || "Das übst du noch (deine häufigste Falle):"),
          muster.length ? el("ul", {}, muster.map(m => el("li", {}, m))) : null,
          el("div", { class: "zeile", style: "margin-top:10px" },
            el("button", { class: "primaer", type: "button", onclick: () => laufStarten(l.modus, l.version, l.runde, nochmals) },
              nochmals.length === 1 ? "Diese Aufgabe nochmals" : `Nur diese ${nochmals.length} nochmals`)))
      : (geloest > 0 ? el("p", { class: "rueckmeldung ok" }, "Alles beim ersten Versuch richtig. Stark!") : null),
    merksatzBox(modusInfo(l.modus).merksatz),
    el("div", { class: "zeile", style: "margin-top:16px" },
      imRaum
        ? el("button", { class: nochmals.length ? "" : "primaer", type: "button", onclick: () => { Zustand.lauf = null; gehe("warten"); } }, "Fertig")
        : el("button", { class: nochmals.length ? "" : "primaer", type: "button", onclick: () => laufStarten(l.modus, l.version, 0) }, "Alle nochmals üben"),
      imRaum
        ? el("button", { type: "button", onclick: () => laufStarten(l.modus, l.version, l.runde, null, true) }, "Alle nochmals üben")
        : el("button", { type: "button", onclick: () => gehe("allein") }, "Andere Übung"))));
  Zustand.hinweis = "";
}

/* ---------- MODUS 5: Check-Bot (regelbasiert, ohne KI, nichts wird gespeichert) ---------- */
function woerterFinden(text, liste) {
  // liefert Treffer [{start, ende, wort}] für Wörter/Wortgruppen aus der Liste
  const treffer = [];
  const klein = text.toLowerCase();
  liste.forEach(eintrag => {
    const stern = eintrag.endsWith("*");
    const vorne = eintrag.startsWith("*");          // «*fahrer*» findet auch «Velofahrer», «Autofahrerin»
    const kern = eintrag.slice(vorne ? 1 : 0, stern ? -1 : undefined).replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/ /g, "\\s+");
    const re = new RegExp(`(^|[^a-zäöüéèàç])(${vorne ? "[a-zäöüéèàç]*" : ""}${kern}${stern ? "[a-zäöüéèàç]*" : ""})(?![a-zäöüéèàç])`, "g");
    let m;
    while ((m = re.exec(klein)) !== null) {
      const start = m.index + m[1].length;
      treffer.push({ start, ende: start + m[2].length, wort: text.slice(start, start + m[2].length) });
      re.lastIndex = start + m[2].length;
    }
  });
  return treffer;
}

function checkbotAnalyse(text) {
  const cb = DATEN.checkbot;
  const saetze = text.replace(/([.!?])\s+/g, "$1\n").split(/\n+/).map(s => s.trim()).filter(s => s.split(/\s+/).length >= 2);
  const marken = [];   // {start, ende, art}
  const gut = [], hin = [];
  const einzig = (arr) => {            // doppelte ohne Rücksicht auf Gross/Klein entfernen, Schreibweise aus dem Text
    const gesehen = new Set(), aus = [];
    arr.slice().sort((a, b) => a.start - b.start).forEach(t => {
      const k = t.wort.toLowerCase().replace(/\s+/g, " ");
      if (!gesehen.has(k)) { gesehen.add(k); aus.push(t.wort.replace(/\s+/g, " ")); }
    });
    return aus;
  };

  // Perfekt: Hilfsverb + Partizip ge…t/ge…en im selben Satz
  const perfekt = [];
  const reSatz = /[^.!?\n]+[.!?]?/g; let ms;
  while ((ms = reSatz.exec(text)) !== null) {
    const satz = ms[0];
    const hv = woerterFinden(satz, cb.hilfsverben);
    const part = /(^|[^A-Za-zÄÖÜäöü])((?:[a-zäöü]+)?ge[a-zäöü]{2,}(?:t|en))(?![A-Za-zÄÖÜäöü])/g;
    let mp; const partizipien = [];
    while ((mp = part.exec(satz)) !== null) partizipien.push({ start: mp.index + mp[1].length, wort: mp[2] });
    if (hv.length && partizipien.length) {
      hv.forEach(h => perfekt.push({ start: ms.index + h.start, ende: ms.index + h.ende, wort: h.wort }));
      partizipien.forEach(p => perfekt.push({ start: ms.index + p.start, ende: ms.index + p.start + p.wort.length, wort: p.wort }));
    }
  }
  const perfektStarts = new Set(perfekt.map(p => p.start));

  const ich = woerterFinden(text, cb.ich);
  const gefuehl = woerterFinden(text, cb.gefuehl);
  const praesens = woerterFinden(text, cb.praesens).filter(t => !perfektStarts.has(t.start));
  const reihe = woerterFinden(text, cb.reihenfolge);
  const ausruf = [...text.matchAll(/!/g)].map(m => ({ start: m.index, ende: m.index + 1, wort: "!" }));
  const hat = (liste) => woerterFinden(text, liste).length > 0;
  const datum = /\b\d{1,2}\.\s?\d{1,2}\.|\b\d{1,2}[:.]\d{2}\b|\b\d{4}\b/.test(text);
  const grundOderFolgen = hat(cb.warum) || hat(cb.folgen || []);

  // Erfolg zuerst: was schon gut ist
  if (hat(cb.wann) || datum) gut.push("Du nennst eine Zeit (Wann?).");
  if (hat(cb.wo)) gut.push("Du nennst einen Ort (Wo?).");
  if (hat(cb.wer)) gut.push("Du nennst Personen (Wer?).");
  if (grundOderFolgen) gut.push("Du nennst einen Grund oder Folgen (Warum? Welche Folgen?).");
  if (reihe.length) gut.push(`Du nutzt Reihenfolgewörter: ${einzig(reihe).join(", ")}.`);
  if (!gefuehl.length && !ausruf.length) gut.push("Ich finde keine Gefühlswörter und keine Ausrufezeichen.");
  if (!praesens.length && !perfekt.length) gut.push("Ich habe keine bekannten Präsens- oder Perfekt-Signale gefunden. Prüfe trotzdem jedes Verb.");

  // Hinweise in fester Reihenfolge: Zeitform, dann Gefühl/Meinung, dann Gerüst
  if (praesens.length) { hin.push(`Präsens-Signal: «${einzig(praesens).join("», «")}». Im Bericht stehen die Verben im Präteritum.`); praesens.forEach(t => marken.push(t)); }
  if (perfekt.length) { hin.push(`Perfekt-Signal: «${einzig(perfekt).join("», «")}». Schreib das Verb im Präteritum.`); perfekt.forEach(t => marken.push(t)); }
  if (ich.length) { hin.push(`Ich-Form oder Wir-Form: «${einzig(ich).join("», «")}». Ein Bericht nennt die Personen meistens mit Namen.`); ich.forEach(t => marken.push(t)); }
  if (gefuehl.length) { hin.push(`Gefühl, Meinung oder Übertreibung? «${einzig(gefuehl).join("», «")}». Prüfe: Ist das sachlich?`); gefuehl.forEach(t => marken.push(t)); }
  if (ausruf.length) { hin.push("Ausrufezeichen: Ein Bericht braucht keine Ausrufezeichen."); ausruf.forEach(t => marken.push(t)); }
  const fehlt = [];
  if (!(hat(cb.wer))) fehlt.push("Wer?");
  if (!(hat(cb.wann) || datum)) fehlt.push("Wann?");
  if (!hat(cb.wo)) fehlt.push("Wo?");
  if (fehlt.length) hin.push(`Ich finde kein Wort für: ${fehlt.join(" ")} Prüfe deine Einleitung.`);
  if (!grundOderFolgen && saetze.length >= 3) hin.push("Ich finde kein Wort für einen Grund oder Folgen (weil, denn, wegen, deshalb, Schaden, verletzt …). Nennt dein Schluss einen Grund oder Folgen?");
  if (!reihe.length && saetze.length >= 3) hin.push("Ich finde keine Reihenfolgewörter. Sie helfen im Hauptteil: zuerst, dann, danach, anschliessend, zum Schluss.");

  return { gut, hin, marken };
}

function textMitMarken(text, marken) {
  const sortiert = marken.slice().sort((a, b) => a.start - b.start);
  const teile = []; let pos = 0;
  sortiert.forEach(m => {
    if (m.start < pos) return;   // Überlappungen überspringen
    teile.push(text.slice(pos, m.start));
    teile.push(el("mark", { class: "markiert" }, text.slice(m.start, m.ende)));
    pos = m.ende;
  });
  teile.push(text.slice(pos));
  return el("div", { class: "cb-text" }, teile);
}

function checkbotBild() {
  const feld = el("textarea", { id: "cb-feld", maxlength: "1500", spellcheck: "false", autocapitalize: "sentences",
                                "aria-label": "Dein Bericht", placeholder: "Schreib oder füge hier deinen Bericht ein." });
  const ergebnis = el("div", { role: "status" });
  const pruefen = () => {
    const text = feld.value.trim();
    feld.blur();
    if (text.split(/\s+/).filter(Boolean).length < 3) {
      ergebnis.replaceChildren(el("p", { class: "rueckmeldung nein" }, "Schreib mindestens einen ganzen Satz."));
      return;
    }
    const a = checkbotAnalyse(text);
    // Version A (Fassung ●): höchstens 3 Hinweise auf einmal, der Rest auf Knopfdruck
    const version = (Zustand.lauf && Zustand.lauf.modus === "m5") ? Zustand.lauf.version : Zustand.version;
    const grenze = version === "A" ? 3 : a.hin.length;
    const liste = el("ul", { class: "cb-liste hin" }, a.hin.slice(0, grenze).map(h => el("li", {}, h)));
    const rest = a.hin.slice(grenze);

        rest.forEach(h => liste.append(el("li", {}, h))); mehr.remove(); } }, `Mehr Hinweise (${rest.length})`) : null;
    ergebnis.replaceChildren(...[
      el("h3", {}, "Das ist schon gut"),
      a.gut.length ? el("ul", { class: "cb-liste gut" }, a.gut.map(g => el("li", {}, "✓ " + g)))
                   : el("p", { class: "gedaempft" }, "Schreib noch etwas mehr. Dann finde ich mehr."),
      el("h3", {}, "Schau nochmals hin"),
      a.hin.length ? liste : el("p", {}, "Ich finde nichts mehr. Prüfe trotzdem mit der Checkliste."),
      rest.length ? el("p", { class: "gedaempft" }, "Verbessere zuerst diese 3 Punkte.") : null,
      mehr,
      a.marken.length ? el("div", {}, el("p", { class: "gedaempft" }, "Diese Stellen sind markiert:"), textMitMarken(text, a.marken)) : null,
      merksatzBox("M3"),
      el("p", { class: "gedaempft" }, "Der Check-Bot ist eine Maschine. Er kann sich irren. Du entscheidest selbst.")
    ].filter(Boolean));
  };
  buehne.append(
    el("div", { class: "karte" },
      el("h2", {}, "Check-Bot: Prüfe deinen Bericht"),
      el("p", {}, "Der Check-Bot gibt dir Hinweise. Er korrigiert nichts."),
      el("p", { class: "gedaempft" }, "Dein Text wird nicht gespeichert und nicht gesendet."),
      feld,
      el("div", { class: "zeile", style: "margin-top:12px" },
        el("button", { class: "primaer", type: "button", onclick: pruefen }, "Text prüfen"),
        el("button", { type: "button", onclick: () => { feld.value = ""; ergebnis.replaceChildren(); } }, "Text löschen"),
        DATEN.checkbot.beispiele.map(b => el("button", { class: "klein", type: "button",
          onclick: () => { feld.value = b.text; pruefen(); } }, b.name)))),
    el("div", { class: "karte" }, ergebnis));
}

async function raumErstellen(meldung) {
  for (let versuch = 0; versuch < 6; versuch++) {
    const code = String(1000 + Math.floor(Math.random() * 9000));
    const r = await Sync.lies(`oeffentlich/raeume/${code}`);
    if (!r.ok) { meldung.textContent = r.status === 0 ? "Keine Verbindung zur Datenbank." : `Die Datenbank lehnt ab (${Sync.fehler}). Regeln prüfen (README_LP.md, Schritt 3).`; return; }
    if (r.daten) continue;     // Code ist besetzt
    const info = { modus: "keiner", runde: 0, status: "warten", vStandard: "A", zeit: Date.now() };
    const w = await Sync.schreib(`oeffentlich/raeume/${code}`, { info });
    if (!w.ok) { meldung.textContent = `Raum konnte nicht erstellt werden (${Sync.fehler}).`; return; }
    Zustand.lp.code = code; Zustand.lp.daten = { info };
    Speicher.schreib("lpRaum", code);
    zeichnen();
    return;
  }
  meldung.textContent = "Kein freier Code gefunden. Nochmals versuchen.";
}

async function infoSchreiben(aenderung, meldung) {
  const lp = Zustand.lp;
  const alt = (lp.daten && lp.daten.info) || { modus: "keiner", runde: 0, status: "warten", vStandard: "A" };
  const neu = Object.assign({}, alt, aenderung, { zeit: Date.now() });
  const r = await Sync.schreib(`oeffentlich/raeume/${lp.code}/info`, neu);
  if (!r.ok) { if (meldung) meldung.textContent = "Konnte nicht speichern. Verbindung prüfen."; return; }
  lp.daten = Object.assign({}, lp.daten, { info: neu });
  zeichnen();
}

function infoSig(info) {
  return info ? [info.modus, info.runde, info.status, info.vStandard].join("|") : "";
}

/* Takt der LP-Ansicht: wird nur einmal gestartet (sonst Endlosschleife beim Neuzeichnen). */
function lpBeobachten() {
  const lp = Zustand.lp;
  if (lp.taktLaeuft === lp.code) return;
  lp.taktLaeuft = lp.code;
  letzteSignatur = null;
  Sync.starteTakt(`oeffentlich/raeume/${lp.code}`, (daten) => {
    if (Zustand.bildschirm !== "lp" || !lp.code) return;
    const z = $("#lp-aktualisiert");
    if (z) z.textContent = "Stand " + new Date().toLocaleTimeString("de-CH");
    if (!hatSichGeaendert(daten)) return;
    const infoAlt = infoSig(lp.daten && lp.daten.info);
    lp.daten = daten;
    if (!daten) return;
    if (lp.anzeige === "rangliste" || lp.anzeige === "klassenziel") { zeichnen(); return; }
    if (lp.anzeige === "steuerung" && infoAlt !== infoSig(daten.info) && darfNeuZeichnen()) { zeichnen(); return; }
    lpTabelleZeichnen();
  });
}

function lpTaktStoppen() {
  Sync.stoppeTakt();
  Zustand.lp.taktLaeuft = null;
}

function spielerListe() {
  const d = Zustand.lp.daten;
  if (!d || !d.spieler) return [];
  return Object.entries(d.spieler).map(([id, s]) => Object.assign({ id }, s));
}

function lpTabelleZeichnen() {
  const ziel = $("#lp-tabelle");

  const zeigen = !!lp.details;
  // ohne Details: feste Reihenfolge nach Gerätekennung (verrät keine Namen), Spalte «Fassung» fehlt
  if (!zeigen) liste.sort((a, b) => String(a.id).localeCompare(String(b.id)));
  ziel.replaceChildren(el("table", {},
    el("thead", {}, el("tr", {}, (zeigen ? ["Spielname", "Fassung", "Übung", "Fortschritt", "Punkte"] : ["Gerät", "Übung", "Fortschritt", "Punkte"]).map(t => el("th", {}, t)))),
    el("tbody", {}, liste.map((s, i) => {
      const geplant = zut[s.id] || info.vStandard || "A";

            if (r.ok) { lp.daten.zuteilung = Object.assign({}, zut, { [s.id]: neu }); lpTabelleZeichnen(); }
          } }, `${fassung(geplant)} ${geplant}`),
          s.v && s.v !== geplant && aktuell ? el("span", { class: "gedaempft" }, ` (jetzt ${fassung(s.v)})`) : null),
        el("td", {}, s.m && s.m !== "keiner" ? modusInfo(s.m).name + (aktuell ? "" : " (alt)") : "wartet"),
        el("td", {}, s.m === "m5" ? el("span", { class: "gedaempft" }, "offen, ohne Zählung")
          : el("div", { class: "zeile", style: "flex-wrap:nowrap" },

              el("span", {}, `${s.b || 0}/${s.t || 0}${s.t && s.b >= s.t ? " ✓" : ""}`))),
        el("td", {}, String(s.p || 0)));
    }))));
