/* Kurztext einer Aufgabe für die Besprechung (Nummer wie in der Aufgabenübersicht). */
function itemKurztext(m, v, nr) {
  const it = DATEN[m][v][nr];
  if (!it) return "";
  if (m === "m1") return `Richtig: «${it.bericht}»`;
  if (m === "m2") return `«${satzAusTeilen(it.teile)}»`;
  if (m === "m3") return `«${it.titel}»`;
  return `«${it.satz.replace("___", "…")}» (${it.grundform})`;
}

/* Anonyme Zähler pro Aufgabe: wie viele Lernende die Aufgabe nicht beim ersten Versuch lösten. */
function oftFalsch(m) {
  const f = (Zustand.lp.daten && Zustand.lp.daten.fehler) || {};
  const liste = [];
  ["A", "B"].forEach(v => {
    Object.entries(f[m + v] || {}).forEach(([nr, n]) => {
      if (Number(n) > 0 && DATEN[m] && DATEN[m][v] && DATEN[m][v][Number(nr)]) liste.push({ m, v, nr: Number(nr), n: Number(n) });
    });
  });
  return liste.sort((a, b) => b.n - a.n || a.nr - b.nr);
}

function lpFehlerZeichnen() {
  const ziel = $("#lp-fehler");
  if (!ziel) return;
  const lp = Zustand.lp;
  const info = (lp.daten && lp.daten.info) || {};
  const m = info.modus && info.modus !== "keiner" ? info.modus : lp.modus;
  if (m === "m5") { ziel.replaceChildren(el("p", { class: "gedaempft" }, "Der Check-Bot zählt keine Fehler.")); return; }
  const top = oftFalsch(m).slice(0, 3);
  const wTop = m === "m2" ? oftFalschW() : [];
  ziel.replaceChildren(...[
    top.length
      ? el("ol", { class: "fehlerliste" }, top.map(e => el("li", {},
          el("b", {}, `${lp.details ? fassung(e.v) + " " : "Version "}${e.v}, Aufgabe ${e.nr + 1}: ${e.n}×`), " ", itemKurztext(e.m, e.v, e.nr))))
      : el("p", { class: "gedaempft" }, `Noch keine Fehlversuche in «${modusInfo(m).name}».`),
    wTop.length ? el("p", {}, el("b", {}, "W-Fragen mit Fehlversuch: "), wTop.map(([w, n]) => `${w} ${n}×`).join(", ")) : null,
    el("p", { class: "gedaempft" }, "Zählt, wie oft eine Aufgabe nicht beim ersten Versuch gelöst wurde: pro Gerät und Runde höchstens einmal, Wiederholungen zählen nicht. Nur Zahlen, keine Namen, keine Antworten. Die Nummer ist dieselbe wie in «Aufgaben ansehen»."),
    top.length
      ? el("button", { class: "klein nicht-drucken", type: "button", onclick: () => frage("Alle Fehlerzähler in diesem Raum auf 0 setzen?", async () => {
          const r = await Sync.loesche(`oeffentlich/raeume/${lp.code}/fehler`);
          if (r.ok && lp.daten) { lp.daten.fehler = null; letzteSignatur = null; lpFehlerZeichnen(); }
        }, "Ja, auf 0 setzen") }, "Zähler auf 0 setzen")
      : null].filter(Boolean));
}

/* Modus 2: welche W-Fragen beim ersten Versuch an einem Satzteil falsch waren (A und B zusammen). */
function oftFalschW() {
  const f = (Zustand.lp.daten && Zustand.lp.daten.fehler) || {};
  const summe = {};
  ["A", "B"].forEach(v => Object.entries(f["m2" + v + "w"] || {}).forEach(([k, n]) => { summe[k] = (summe[k] || 0) + (Number(n) || 0); }));
  const name = Object.fromEntries(Object.entries(W_SCHLUESSEL).map(([w, k]) => [k, w]));
  return Object.entries(summe).filter(([k, n]) => n > 0 && name[k]).sort((a, b) => b[1] - a[1]).map(([k, n]) => [name[k], n]);
}

/* Aufgabe für die gemeinsame Besprechung: wie auf Papier, ohne Fassungssymbol, ohne Zähler, Lösung auf Knopfdruck. */
function besprechungsInhalt(m, v, nr, mitLoesung) {
  const it = DATEN[m][v][nr];
  const seed = nr + 1 + (v === "B" ? 100 : 0) + m.charCodeAt(1) * 1000;
  if (m === "m1") return el("div", { class: "stapel" }, festMischen([it.bericht, ...it.andere], seed).map(t =>
    el("div", { class: "antwort" + (mitLoesung && t === it.bericht ? " richtig" : "") }, (mitLoesung && t === it.bericht ? "✓ " : "") + t)));
  if (m === "m2") return el("p", { class: "beamer-satz" }, mitLoesung
    ? it.teile.map(([t, w]) => w ? el("span", {}, el("u", {}, t), el("sup", {}, " " + w), " ") : t + " ")
    : satzAusTeilen(it.teile));
  if (m === "m3") {
    const zeilen = mitLoesung ? it.schritte : festMischen(it.schritte, seed, true);
    return [el("h3", {}, it.titel), el(mitLoesung ? "ol" : "ul", { class: "beamer-liste" }, zeilen.map(t => el("li", {}, t)))];
  }
  const richtig = it.optionen.find(o => o[1] === "praet")[0];
  return [el("p", { class: "beamer-satz" }, it.satz.replace("___", mitLoesung ? `[${richtig}]` : "_____"), el("span", { class: "gedaempft" }, ` (${it.grundform})`)),
    el("p", {}, it.optionen.map(o => o[0]).join("   ·   "))];
}

function lpOftFalschBeamer() {
  const lp = Zustand.lp;
  const info = (lp.daten && lp.daten.info) || {};
  const m = info.modus && info.modus !== "keiner" ? info.modus : lp.modus;
  const top = m === "m5" ? [] : oftFalsch(m).slice(0, 3);
  const nr = Math.min(lp.oftNr || 0, Math.max(0, top.length - 1));
  const e = top[nr];
  const wTop = m === "m2" ? oftFalschW() : [];
  buehne.append(el("div", { class: "karte" },
    el("h2", {}, "Diese Aufgabe besprechen wir"),
    e ? [el("p", { class: "gedaempft" }, PAPIER_AUFTRAG[m]),
         ...[].concat(besprechungsInhalt(m, e.v, e.nr, !!lp.oftLoesung)),
         wTop.length ? el("p", {}, `In dieser Übung oft schwierig: ${wTop.slice(0, 2).map(x => x[0]).join(" und ")}`) : null]
      : el("p", {}, m === "m5" ? "Der Check-Bot zählt keine Fehler." : "Noch keine Aufgabe mit Fehlversuch."),
    el("div", { class: "zeile nicht-drucken", style: "margin-top:16px" },
      e ? el("button", { type: "button", onclick: () => { lp.oftLoesung = !lp.oftLoesung; zeichnen(); } }, lp.oftLoesung ? "Lösung verbergen" : "Lösung zeigen") : null,
      top.length > 1 ? el("button", { type: "button", onclick: () => { lp.oftNr = (nr + 1) % top.length; lp.oftLoesung = false; zeichnen(); } }, `Andere Aufgabe (${nr + 1} von ${top.length})`) : null,
      el("button", { class: "primaer", type: "button", onclick: () => { lp.anzeige = "steuerung"; zeichnen(); } }, "Zurück zur Steuerung"))));
}

/* Klassenziel statt Rangliste: alle gelösten Aufgaben der Klasse zusammen, ohne Namen und ohne Plätze. */
function lpKlassenziel() {
  const lp = Zustand.lp;
  const info = (lp.daten && lp.daten.info) || {};
  const dabei = spielerListe().filter(s => s.m === info.modus && s.rd === info.runde && s.m !== "m5" && s.m !== "keiner");
  const geloest = dabei.reduce((summe, s) => summe + Math.min(s.b || 0, s.t || 0), 0);
  const moeglich = dabei.reduce((summe, s) => summe + (s.t || 0), 0);
  const fertig = dabei.filter(s => s.t && s.b >= s.t).length;
  const anteil = moeglich ? Math.round(geloest / moeglich * 100) : 0;
  buehne.append(el("div", { class: "karte" },
    el("h2", {}, info.modus && info.modus !== "keiner" ? `Klassenziel: ${modusInfo(info.modus).name}` : "Klassenziel"),
    dabei.length
      ? [el("p", { class: "ziel-zahl" }, `Zusammen gelöst: ${geloest} von ${moeglich} Aufgaben`),
         el("div", { class: "ziel-balken", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": String(moeglich), "aria-valuenow": String(geloest) },
           el("i", { style: `width:${anteil}%` })),
         el("p", {}, `${fertig} von ${dabei.length} sind fertig.`)]
      : el("p", {}, "Noch keine Übung gestartet oder noch niemand dabei."),
    el("p", { class: "gedaempft" }, "Ohne Namen und ohne Plätze. Jede gelöste Aufgabe zählt für die ganze Klasse."),
    el("div", { class: "zeile nicht-drucken" },
      el("button", { class: "primaer", type: "button", onclick: () => { lp.anzeige = "steuerung"; zeichnen(); } }, "Zurück zur Steuerung"))));
  if (lp.code) lpBeobachten();
}

function lpRangliste() {
  const lp = Zustand.lp;
  const info = (lp.daten && lp.daten.info) || {};
  const top = spielerListe().filter(s => s.m === info.modus && s.rd === info.runde && s.m !== "m5")
    .sort((a, b) => (b.p || 0) - (a.p || 0)).slice(0, 3);
  buehne.append(el("div", { class: "karte" },
    el("h2", {}, info.modus && info.modus !== "keiner" ? `Rangliste: ${modusInfo(info.modus).name}` : "Rangliste"),
    top.length ? el("ol", { class: "rang" }, top.map(s => el("li", {}, `${s.n} · ${s.p || 0} Punkte`)))
               : el("p", {}, "Noch keine Punkte."),
    el("p", { class: "gedaempft" }, "Es werden nur die ersten drei Plätze gezeigt."),
    el("div", { class: "zeile nicht-drucken" },
      el("button", { class: "primaer", type: "button", onclick: () => { lp.anzeige = "steuerung"; zeichnen(); } }, "Zurück zur Steuerung"))));
  if (lp.code) lpBeobachten();
}

function lpExport() {
  const zeilen = [["Spielname", "Fassung", "Übung", "Runde", "gelöst", "Aufgaben", "Punkte", "Zeit"]];
  spielerListe().forEach(s => zeilen.push([s.n, `${fassung(s.v)} ${s.v}`, s.m && s.m !== "keiner" ? modusInfo(s.m).name : "-",
    s.rd, s.b, s.t, s.p, new Date(s.zeit || Date.now()).toLocaleString("de-CH")]));
  // Oft falsch (anonyme Zähler pro Aufgabe) für die formative Auswertung
  const fehler = ["m1", "m2", "m3", "m4"].flatMap(m => oftFalsch(m));
  if (fehler.length) {
    zeilen.push([], ["Übung", "Fassung", "Aufgabe", "nicht beim ersten Versuch gelöst", "Aufgabe (Kurztext)"]);
    fehler.forEach(e => zeilen.push([modusInfo(e.m).name, `${fassung(e.v)} ${e.v}`, e.nr + 1, e.n, itemKurztext(e.m, e.v, e.nr)]));
  }
  csvHerunterladen(`bericht-detektiv_raum-${Zustand.lp.code}.csv`, zeilen);
}

async function raumSchliessen() {
  const lp = Zustand.lp;
  lpTaktStoppen();
  await Sync.loesche(`oeffentlich/raeume/${lp.code}`);
  lp.code = null; lp.daten = null;
  Speicher.loesche("lpRaum");
  zeichnen();
}

/* Aufgabenübersicht nach Fassung ● / ■, druckbar.
   Standard: Papierfassung für die Lernenden OHNE Lösungen (Rückfallplan).
   Option «mit Lösungen» nur für die LP (Kontrolle). Reihenfolgen auf Papier sind fest gemischt (gleich bei jedem Druck). */
function festMischen(liste, seed, nieGleich = false) {
  // deterministisch (mulberry32), damit jeder Ausdruck gleich aussieht
  let t = (seed * 2654435761) >>> 0;
  const zufall = () => { t = (t + 0x6D2B79F5) >>> 0; let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r; return ((r ^ (r >>> 14)) >>> 0) / 4294967296; };
  const a = liste.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(zufall() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  if (nieGleich && a.length > 1 && a.every((x, i) => x === liste[i])) a.reverse();   // Anleitung: nie in Lösungsreihenfolge
  return a;
}

function satzAusTeilen(teile) {
  return teile.map(t => t[0]).join(" ").replace(/ ([.,])/g, "$1");
}

const PAPIER_AUFTRAG = {
  m1: "Welcher Satz passt in einen Bericht? Kreuze ihn an.",
  m2: "Unterstreiche die Satzteile. Schreibe die passende W-Frage darüber.",
  m3: "In welcher Reihenfolge machst du die Schritte? Schreibe die Nummern 1, 2, 3 … auf die Linien.",
  m4: "Welche Verbform passt in einen Bericht? Kreuze sie an."
};

function lpUebersicht() {
  const lp = Zustand.lp;
  const m = lp.uebersichtModus;
  const mitLoesung = !!lp.uebersichtLoesung;
  const welche = lp.uebersichtVersion || "AB";
  const tabs = el("div", { class: "segment nicht-drucken", style: "flex-wrap:wrap" }, DATEN.modi.map(x =>
    el("button", { type: "button", class: x.id === m ? "an" : "", style: "flex:1 1 150px",
                   onclick: () => { lp.uebersichtModus = x.id; zeichnen(); } }, `${x.sym} ${x.name}`)));
  const optionen = el("div", { class: "zeile nicht-drucken", style: "margin-top:12px;align-items:center" },
    el("label", { style: "display:flex;gap:8px;align-items:center" },
      el("input", { type: "checkbox", checked: mitLoesung, onchange: (e) => { lp.uebersichtLoesung = e.target.checked; zeichnen(); } }),
      "mit Lösungen (nur für die LP)"),
    el("span", { class: "gedaempft" }, "Drucken:"),
    ...[["AB", "Version A und B"], ["A", "nur Version A ●"], ["B", "nur Version B ■"]].map(([k, t]) =>
      el("button", { type: "button", class: k === welche ? "an" : "", onclick: () => { lp.uebersichtVersion = k; zeichnen(); } }, t)));

  const kaestchen = (text) => el("div", { class: "papier-wahl" }, "☐ " + text);
  const spalte = (v) => {
    if (m === "m5") return el("div", {}, el("p", {}, "Der Check-Bot hat keine Aufgaben und keine Fassungen. Er prüft auf: Ich-/Wir-Form, Gefühls- und Meinungswörter, Ausrufezeichen, Präsens- und Perfekt-Signale, fehlende Wörter für Wer/Wann/Wo und (ab 3 Sätzen) für Grund oder Folgen, Reihenfolgewörter (ab 3 Sätzen). In Version A höchstens 3 Hinweise auf einmal. Wortlisten im Block DATEN.checkbot in index.html."));
    const items = DATEN[m][v];
    const kopf = mitLoesung
      ? el("h3", {}, `${fassung(v)} Version ${v} (${items.length}): Lösungen`)
      : el("h3", {}, `${fassung(v)} Version ${v}`);
    const zusatz = (!mitLoesung && m === "m2") ? el("p", { class: "gedaempft" }, "W-Fragen: " + DATEN.m2.knoepfe[v].join(" ") + " · Bei «Was?» unterstreichst du das Verb und das Ding, auch wenn sie getrennt stehen.") : null;
    return el("div", {}, kopf, zusatz, items.map((it, i) => {
      const seed = i + 1 + (v === "B" ? 100 : 0) + m.charCodeAt(1) * 1000;
      let inhalt;
      if (mitLoesung) {
        if (m === "m1") inhalt = [el("div", {}, "✓ " + it.bericht), ...it.andere.map(a => el("div", { class: "gedaempft" }, "✗ " + a))];
        else if (m === "m2") inhalt = el("div", {}, it.teile.map(([t, w]) => w ? el("span", {}, el("u", {}, t), el("sup", {}, " " + w), " ") : t + " "));
        else if (m === "m3") inhalt = [el("b", {}, it.titel), el("ol", { style: "margin:4px 0;padding-left:22px" }, it.schritte.map(s => el("li", {}, s)))];
        else inhalt = el("div", {}, it.satz.replace("___", `[${it.optionen.find(o => o[1] === "praet")[0]}]`), el("span", { class: "gedaempft" }, ` (${it.grundform}; Auswahl: ${it.optionen.map(o => o[0]).join(" / ")})`));
      } else {
        if (m === "m1") inhalt = festMischen([it.bericht, ...it.andere], seed).map(kaestchen);
        else if (m === "m2") inhalt = el("div", { class: "papier-satz" }, satzAusTeilen(it.teile));
        else if (m === "m3") {
          // Schritt 1 steht schon da, falls in DATEN.m3.schritt1Vorgegeben so eingestellt (wie in der App)
          const vorgegeben = DATEN.m3.schritt1Vorgegeben[v] ? it.schritte[0] : null;
          const rest = festMischen(vorgegeben ? it.schritte.slice(1) : it.schritte, seed, true);
          const zeilen = (vorgegeben ? [vorgegeben] : []).concat(rest);
          inhalt = [el("b", {}, it.titel), el("div", {}, zeilen.map(s =>
            el("div", { class: "papier-wahl" }, (s === vorgegeben ? "  1  " : "____ ") + "  " + s)))];
        }
        else inhalt = [el("div", {}, it.satz + ` (${it.grundform})`),
                       el("div", { class: "papier-reihe" }, festMischen(it.optionen.map(o => o[0]), seed).map(kaestchen))];
      }
      return el("div", { class: "uebersicht-item" }, el("b", {}, `${i + 1}. `), inhalt);
    }));
  };
  const versionen = m === "m5" ? ["A"] : (welche === "AB" ? ["A", "B"] : [welche]);
  const titel = mitLoesung ? `Lösungen: ${modusInfo(m).name}` : `Bericht-Detektiv: ${modusInfo(m).name}`;
  const auftrag = mitLoesung
    ? el("p", { class: "gedaempft" }, `Auftrag auf dem Bildschirm: «${m === "m5" ? "Prüfe deinen Bericht." : DATEN[m].auftrag}» · Merksatz ${modusInfo(m).merksatz}`)
    : el("p", {}, el("b", {}, "Auftrag: "), m === "m5" ? "Prüfe deinen Bericht." : PAPIER_AUFTRAG[m]);
  buehne.append(
    el("div", { class: "karte" },
      el("h2", {}, titel),
      mitLoesung ? null : el("p", { class: "papier-name" }, "Name: ______________________________"),
      auftrag,
      el("p", { class: "gedaempft nicht-drucken" }, mitLoesung
        ? "Lösungsübersicht für die LP. Nicht an die Lernenden abgeben."
        : "Papierfassung für die Lernenden, ohne Lösungen. Die Lösungen siehst du mit «mit Lösungen»."),
      tabs, optionen),
    el("div", { class: "karte" }, el("div", { class: versionen.length > 1 ? "spalten" : "" }, versionen.map(spalte))),
    el("div", { class: "zeile nicht-drucken" },
      el("button", { class: "primaer", type: "button", onclick: () => { lp.anzeige = "steuerung"; zeichnen(); } }, "Zurück"),
      el("button", { type: "button", onclick: () => window.print() }, mitLoesung ? "Lösungen drucken" : "Papierfassung drucken")));
}

/* ========================================================================
   6. START
   ======================================================================== */
(function start() {
  const gespeichert = Speicher.lies("sitzung", null);
  if (!(ONLINE_EINGERICHTET && gespeichert && gespeichert.art === "raum")) Speicher.loesche("sitzung");
  zeichnen();
})();
</script>
